<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Hub · 生图工作台</title>
<style>
/* ═══════════════════════════════════════════════════════
   设计系统
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* 颜色 —— 温暖的深色调 */
  --bg:         #0a0a0d;
  --bg-tint:    #0d0d11;
  --surface-1:  #14141a;
  --surface-2:  #1a1a22;
  --surface-3:  #22222c;
  --surface-4:  #2c2c38;
  --border:     rgba(255,255,255,.06);
  --border-strong: rgba(255,255,255,.1);

  /* 强调色 —— 紫罗兰渐变 */
  --accent:       #8b7aff;
  --accent-2:     #c77dff;
  --accent-3:     #ff7dd4;
  --accent-grad:  linear-gradient(135deg, #8b7aff 0%, #c77dff 50%, #ff7dd4 100%);
  --accent-glow:  radial-gradient(ellipse at center, rgba(139,122,255,.4), transparent 60%);

  /* 文本 */
  --text:         #f0f0f5;
  --text-soft:    #b8b8c8;
  --text-muted:   #6e6e82;
  --text-faded:   #484858;

  /* 几何 */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 999px;

  /* 布局 */
  --sidebar-w: 232px;

  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.15);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.3);
  --shadow-glow: 0 0 40px rgba(139,122,255,.25);

  /* 动效 */
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "SF Pro Display", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  line-height: 1.55;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
}

body {
  display: flex;
  flex-direction: column;
  /* 背景装饰光晕 */
  background-image:
    radial-gradient(ellipse 800px 400px at 50% -200px, rgba(139,122,255,.08), transparent),
    radial-gradient(ellipse 600px 400px at 100% 100%, rgba(255,125,212,.04), transparent);
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.15); }

button { font-family: inherit; cursor: pointer; }

/* ═══════════════════════════════════════════════════════
   顶栏
═══════════════════════════════════════════════════════ */
.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(14,14,20,.7);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  flex-shrink: 0;
  position: relative;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: -.01em;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent-grad);
  box-shadow: 0 0 20px rgba(139,122,255,.4);
  position: relative;
}
.brand-mark::after {
  content: '';
  position: absolute; inset: 3px;
  background: var(--bg);
  border-radius: 3px;
}
.brand-mark::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 6px;
  background: var(--accent-grad);
  filter: blur(8px);
  opacity: .6;
  z-index: -1;
}
.brand-text { font-weight: 700; }
.brand-text span {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.divider-v { width: 1px; height: 18px; background: var(--border-strong); }

.tabs { display: flex; gap: 2px; align-items: center; }
.tab {
  padding: 6px 14px;
  border-radius: var(--r-sm);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all .2s var(--ease);
  position: relative;
  border: none;
  background: none;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab.active {
  color: var(--text);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border-strong);
}
.tab.active::before {
  content: '';
  position: absolute;
  left: 12px; right: 12px;
  bottom: -1px; height: 2px;
  background: var(--accent-grad);
  border-radius: 2px 2px 0 0;
}

.top-spacer { flex: 1; }

.icon-btn {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .18s var(--ease);
}
.icon-btn:hover {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border-strong);
}

/* ═══════════════════════════════════════════════════════
   主体
═══════════════════════════════════════════════════════ */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--sidebar-w);
  overflow: hidden;
}

/* ─────── 侧栏 ─────── */
.sidebar {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-tint);
  position: relative;
}
.sidebar.left { border-right: 1px solid var(--border); }
.sidebar.right { border-left: 1px solid var(--border); }

.sidebar-head {
  padding: 14px 14px 8px;
  flex-shrink: 0;
}
.sidebar-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: .06em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.sidebar-title::before {
  content: '';
  width: 3px; height: 12px;
  background: var(--accent-grad);
  border-radius: var(--r-full);
}
.sidebar-count {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 1px 8px;
  font-variant-numeric: tabular-nums;
}
.sidebar-sub {
  font-size: 11px;
  color: var(--text-muted);
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 4px 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-gutter: stable;
}

/* 模板卡 */
.tpl-card {
  border-radius: var(--r-md);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--surface-1);
  border: 1px solid var(--border);
  transition: transform .25s var(--ease), border-color .2s var(--ease), box-shadow .25s var(--ease);
  flex-shrink: 0;
}
.tpl-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}
.tpl-card:active { transform: translateY(0); }

.tpl-img {
  width: 100%;
  aspect-ratio: 4/3;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
.tpl-img::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,.3) 100%);
  pointer-events: none;
}

/* 底部 1/4 渐变浮层 + 提示词 */
.tpl-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 32px 10px 9px;
  background: linear-gradient(
    to top,
    rgba(10,10,13,.96) 0%,
    rgba(10,10,13,.82) 35%,
    rgba(10,10,13,.4) 70%,
    transparent 100%
  );
  pointer-events: none;
  z-index: 2;
}
.tpl-prompt {
  font-size: 10.5px;
  line-height: 1.45;
  color: rgba(240,240,245,.78);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: 0;
}

/* 卡片底部条 */
.tpl-foot {
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-1);
  border-top: 1px solid var(--border);
  gap: 8px;
}
.tpl-title {
  font-size: 11.5px;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.tpl-use {
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  color: var(--text-soft);
  border: 1px solid transparent;
  transition: all .15s var(--ease);
  flex-shrink: 0;
  letter-spacing: 0;
}
.tpl-use:hover {
  background: var(--accent-grad);
  color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 4px 12px rgba(139,122,255,.3);
}

/* 渐变图块（多色调） */
.grad-a { background: linear-gradient(135deg, #2d1b5e 0%, #6b3cc9 50%, #8b4ed9 100%); }
.grad-b { background: linear-gradient(135deg, #0f3528 0%, #1e7a4a 50%, #2db87a 100%); }
.grad-c { background: linear-gradient(135deg, #4a0f2a 0%, #9a1f5b 50%, #d63a8a 100%); }
.grad-d { background: linear-gradient(135deg, #2a3a0f 0%, #5e7a1f 50%, #8ab82d 100%); }
.grad-e { background: linear-gradient(135deg, #0f1f3a 0%, #1f4a85 50%, #2d7ad6 100%); }
.grad-f { background: linear-gradient(135deg, #3a200f 0%, #855a1f 50%, #d68a2d 100%); }
.grad-g { background: linear-gradient(135deg, #1a1a2e 0%, #3d3d6b 50%, #5e5e9a 100%); }
.grad-h { background: linear-gradient(135deg, #2a1040 0%, #6b2080 50%, #b040c0 100%); }

/* ═══════════════════════════════════════════════════════
   中间 · 对话生图流
═══════════════════════════════════════════════════════ */
.center {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 顶部信息条 */
.center-head {
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(14,14,20,.5);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
  z-index: 5;
}
.session-info { display: flex; align-items: center; gap: 10px; }
.session-avatar {
  width: 26px; height: 26px;
  border-radius: var(--r-sm);
  background: var(--accent-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  box-shadow: 0 0 20px rgba(139,122,255,.3);
}
.session-title { font-weight: 600; font-size: 13px; }
.session-sub { font-size: 11px; color: var(--text-muted); }

.session-actions { display: flex; gap: 4px; }

/* 消息流 */
.chat-feed {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 32px;
  scroll-behavior: smooth;
}

/* 用户消息 */
.msg-user {
  align-self: flex-end;
  max-width: 68%;
  background: linear-gradient(135deg, rgba(139,122,255,.18), rgba(199,125,255,.12));
  border: 1px solid rgba(139,122,255,.25);
  border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
  padding: 11px 15px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text);
  box-shadow: 0 2px 10px rgba(139,122,255,.1);
  backdrop-filter: blur(8px);
  animation: slideInRight .4s var(--ease);
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateY(8px) translateX(10px); }
  to   { opacity: 1; transform: none; }
}

/* AI 生成块 */
.gen-block {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  animation: slideInLeft .45s var(--ease);
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.gen-avatar {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--accent-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(139,122,255,.35), inset 0 1px 0 rgba(255,255,255,.2);
  position: relative;
}
.gen-avatar::before {
  content: '';
  position: absolute; inset: -2px;
  border-radius: inherit;
  background: var(--accent-grad);
  filter: blur(12px);
  opacity: .4;
  z-index: -1;
}

.gen-content { flex: 1; min-width: 0; }

/* 图片网格 */
.img-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  background: var(--surface-1);
  box-shadow: var(--shadow-md);
}
.img-grid.single { grid-template-columns: 1fr; }
.img-grid.triple { grid-template-columns: repeat(3, 1fr); }

.img-cell {
  position: relative;
  aspect-ratio: 16/10;
  overflow: hidden;
  cursor: pointer;
  background: var(--surface-2);
  transition: transform .4s var(--ease);
}
.img-cell:hover { transform: scale(1.01); z-index: 2; }

.img-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  opacity: .85;
  position: relative;
}
.img-ph::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.15), transparent 50%),
    radial-gradient(ellipse at 70% 70%, rgba(0,0,0,.2), transparent 50%);
}

/* 图片浮层操作 */
.img-hover {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.3) 40%, transparent 70%);
  opacity: 0;
  transition: opacity .2s var(--ease);
  display: flex;
  align-items: flex-end;
  padding: 10px;
  gap: 5px;
}
.img-cell:hover .img-hover { opacity: 1; }

.img-chip {
  background: rgba(255,255,255,.14);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--r-sm);
  color: #fff;
  font-size: 10.5px;
  font-weight: 500;
  padding: 4px 9px;
  transition: background .15s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.img-chip:hover { background: rgba(255,255,255,.24); }

.img-num {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: var(--r-full);
  letter-spacing: .05em;
  z-index: 2;
}

/* 元信息行 */
.gen-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 3px 10px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-soft);
  letter-spacing: 0;
}
.meta-chip.accent {
  background: linear-gradient(135deg, rgba(139,122,255,.18), rgba(199,125,255,.12));
  border-color: rgba(139,122,255,.3);
  color: #d4c9ff;
}
.meta-dot {
  width: 6px; height: 6px;
  border-radius: var(--r-full);
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* 操作栏 */
.gen-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text-soft);
  padding: 5px 11px;
  transition: all .15s var(--ease);
  letter-spacing: 0;
}
.action-btn:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
}
.action-btn.primary {
  background: var(--accent-grad);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 8px rgba(139,122,255,.3);
}
.action-btn.primary:hover { box-shadow: 0 4px 14px rgba(139,122,255,.45); }

/* 打字动画 */
.thinking {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  width: fit-content;
  font-size: 12px;
  color: var(--text-muted);
}
.thinking-dots { display: flex; gap: 3px; }
.thinking-dots span {
  width: 5px; height: 5px;
  border-radius: var(--r-full);
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: .15s; }
.thinking-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: .3; transform: scale(.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* 空状态 */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  text-align: center;
}
.empty-icon {
  width: 72px; height: 72px;
  border-radius: var(--r-xl);
  background: var(--accent-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 12px 40px rgba(139,122,255,.35);
  position: relative;
  animation: floaty 3.5s ease-in-out infinite;
}
.empty-icon::before {
  content: '';
  position: absolute; inset: -6px;
  background: var(--accent-grad);
  border-radius: inherit;
  filter: blur(20px);
  opacity: .5;
  z-index: -1;
}
@keyframes floaty {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-6px); }
}
.empty-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.01em;
  background: linear-gradient(180deg, var(--text), var(--text-soft));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.empty-sub {
  font-size: 12.5px;
  color: var(--text-muted);
  max-width: 260px;
  line-height: 1.7;
}
.empty-chips {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center; max-width: 340px;
  margin-top: 6px;
}
.empty-chip {
  font-size: 11.5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 5px 12px;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s var(--ease);
}
.empty-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

/* ═══════════════════════════════════════════════════════
   输入区
═══════════════════════════════════════════════════════ */
.composer {
  padding: 12px 20px 14px;
  border-top: 1px solid var(--border);
  background: rgba(14,14,20,.85);
  backdrop-filter: blur(20px) saturate(140%);
  flex-shrink: 0;
  position: relative;
}
.composer::before {
  content: '';
  position: absolute;
  top: -40px; left: 0; right: 0; height: 40px;
  background: linear-gradient(to top, var(--bg), transparent);
  pointer-events: none;
}

.composer-refs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  min-height: 0;
  transition: min-height .2s var(--ease);
}
.composer-refs:not(:empty) { min-height: 26px; }

.ref-count-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}
.ref-count-chip span {
  color: var(--accent);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.ref-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  padding: 3px 4px 3px 3px;
  font-size: 11px;
  color: var(--text-soft);
  animation: popIn .25s var(--ease-bounce);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.85); }
  to   { opacity: 1; transform: scale(1); }
}
.ref-badge-thumb {
  width: 18px; height: 18px;
  border-radius: 4px;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ref-badge-name { font-weight: 500; }
.ref-badge-x {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--text-muted);
  font-size: 10px;
  transition: all .12s var(--ease);
}
.ref-badge-x:hover { background: var(--surface-4); color: var(--text); }

/* 输入框 */
.composer-box {
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  padding: 10px 10px 8px 16px;
  transition: all .2s var(--ease);
  box-shadow: var(--shadow-sm);
}
.composer-box:focus-within {
  border-color: rgba(139,122,255,.4);
  box-shadow: 0 0 0 3px rgba(139,122,255,.08), var(--shadow-sm);
  background: var(--surface-2);
}

.composer-input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}
.composer-textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 13.5px;
  font-family: inherit;
  line-height: 1.55;
  resize: none;
  max-height: 120px;
  min-height: 24px;
  padding: 4px 0 4px;
  letter-spacing: 0;
}
.composer-textarea::placeholder {
  color: var(--text-muted);
}

.composer-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.composer-btn {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s var(--ease);
}
.composer-btn:hover {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.send-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  background: var(--accent-grad);
  border: none;
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(139,122,255,.4);
  transition: all .2s var(--ease);
  margin-left: 2px;
}
.send-btn:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 6px 20px rgba(139,122,255,.55); }
.send-btn:active { transform: translateY(0); }
.send-btn:disabled {
  background: var(--surface-3);
  box-shadow: none;
  color: var(--text-faded);
  cursor: not-allowed;
}

/* 参数条 */
.composer-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 0 2px;
}
.param-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 4px 11px;
  font-size: 11px;
  color: var(--text-soft);
  font-weight: 500;
  transition: all .15s var(--ease);
}
.param-chip:hover {
  border-color: var(--border-strong);
  background: var(--surface-3);
  color: var(--text);
}
.param-chip .dot {
  width: 5px; height: 5px;
  border-radius: var(--r-full);
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
}
.param-chip .caret { color: var(--text-muted); font-size: 8px; }

.composer-hint {
  margin-left: auto;
  font-size: 10.5px;
  color: var(--text-faded);
  letter-spacing: .02em;
}
.kbd {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  font-family: "SF Mono", ui-monospace, monospace;
  font-size: 9.5px;
  color: var(--text-soft);
  margin: 0 2px;
}

/* ═══════════════════════════════════════════════════════
   模态弹窗
═══════════════════════════════════════════════════════ */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(5,5,8,.72);
  backdrop-filter: blur(20px) saturate(120%);
  -webkit-backdrop-filter: blur(20px) saturate(120%);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease);
}
.modal-bg.open { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-xl);
  overflow: hidden;
  max-width: 720px;
  width: 100%;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  transform: translateY(16px) scale(.97);
  transition: transform .3s var(--ease);
  box-shadow: var(--shadow-lg);
  position: relative;
}
.modal-bg.open .modal { transform: none; }

.modal-img-wrap {
  width: 100%;
  aspect-ratio: 16/9;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.modal-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
}

.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.1);
  color: #fff;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
  transition: all .15s var(--ease);
}
.modal-close:hover { background: rgba(0,0,0,.8); transform: scale(1.05); }

.modal-body {
  padding: 18px 22px 22px;
  overflow-y: auto;
  flex: 1;
}
.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.modal-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.modal-score {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-soft);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 4px 10px;
  flex-shrink: 0;
}

.modal-section-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.modal-prompt {
  font-size: 12.5px;
  color: var(--text-soft);
  line-height: 1.7;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: 0;
}

.modal-tags {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.modal-tag {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  padding: 3px 11px;
  font-size: 11px;
  color: var(--text-soft);
}

.modal-actions {
  display: flex;
  gap: 8px;
}
.modal-btn {
  flex: 1;
  padding: 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  transition: all .18s var(--ease);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  letter-spacing: 0;
}
.modal-btn:hover { border-color: var(--accent); color: var(--accent); }
.modal-btn.primary {
  background: var(--accent-grad);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 16px rgba(139,122,255,.35);
}
.modal-btn.primary:hover {
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(139,122,255,.5);
}

/* ─ 小图标 SVG ─ */
.ic { width: 14px; height: 14px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ic-sm { width: 12px; height: 12px; }
.ic-lg { width: 16px; height: 16px; }

    prompt:'fantasy elf girl, silver hair flowing in wind, forest background, glowing eyes, detailed fantasy art, soft lighting',
    tags:['奇幻','人物'] },
  { id:104, title:'机械玫瑰 · 1d', icon:'🌹', grad:'grad-c', score:'4.7',
    prompt:'mechanical rose, steampunk style, intricate gears and cogs, brass and copper tones, macro photography',
    tags:['蒸汽朋克'] },
  { id:105, title:'极光雪原 · 2d', icon:'❄', grad:'grad-e', score:'4.9',
    prompt:'northern lights aurora borealis, snowy tundra, reflection on frozen lake, dramatic sky, long exposure photography',
    tags:['自然','极光'] },
  { id:106, title:'废弃教堂 · 3d', icon:'⛪', grad:'grad-g', score:'4.5',
    prompt:'abandoned gothic cathedral interior, beams of light through broken stained glass, overgrown vines, atmospheric dust particles',
    tags:['废墟','哥特'] },
];

/* ═══════════════════════════════════════════════════════
   状态
═══════════════════════════════════════════════════════ */
let activeRefs = [];
let currentModal = null;

/* ═══════════════════════════════════════════════════════
   工具：图标
═══════════════════════════════════════════════════════ */
const svgIcon = (id, cls='ic') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

/* ═══════════════════════════════════════════════════════
   侧栏 · 模板卡
═══════════════════════════════════════════════════════ */
function createTplCard(item) {
  const card = document.createElement('article');
  card.className = 'tpl-card';
  card.innerHTML = `
    <div class="tpl-img ${item.grad}">
      <span>${item.icon}</span>
      <div class="tpl-overlay">
        <div class="tpl-prompt">${item.prompt}</div>
      </div>
    </div>
    <div class="tpl-foot">
      <span class="tpl-title">${item.title}</span>
      <button class="tpl-use" data-action="use">复用</button>
    </div>`;

  card.addEventListener('click', (e) => {
    if (e.target.closest('[data-action="use"]')) {
      e.stopPropagation();
      useTemplate(item);
      return;
    }
    openModal(item);
  });
  return card;
}

function renderSidebar(id, items) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  items.forEach(x => el.appendChild(createTplCard(x)));
}

/* ═══════════════════════════════════════════════════════
   使用模板
═══════════════════════════════════════════════════════ */
function useTemplate(item) {
  if (!activeRefs.find(r => r.id === item.id)) activeRefs.push(item);
  renderRefs();
  const ta = document.getElementById('composer-input');
  ta.value = item.prompt;
  autoResize(ta);
  ta.focus();
}

function renderRefs() {
  const el = document.getElementById('composer-refs');
  el.innerHTML = '';
  if (activeRefs.length === 0) return;

  const count = document.createElement('div');
  count.className = 'ref-count-chip';
  count.innerHTML = `参考图 <span>${activeRefs.length}/14</span>`;
  el.appendChild(count);

  activeRefs.forEach(ref => {
    const b = document.createElement('div');
    b.className = 'ref-badge';
    b.innerHTML = `
      <div class="ref-badge-thumb ${ref.grad}">${ref.icon}</div>
      <span class="ref-badge-name">${ref.title}</span>
      <button class="ref-badge-x" data-id="${ref.id}">${svgIcon('i-x','ic ic-sm')}</button>`;
    b.querySelector('.ref-badge-x').addEventListener('click', () => {
      activeRefs = activeRefs.filter(r => r.id !== ref.id);
      renderRefs();
    });
    el.appendChild(b);
  });
}

/* ═══════════════════════════════════════════════════════
   输入框自适应
═══════════════════════════════════════════════════════ */
function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}

/* ═══════════════════════════════════════════════════════
   弹窗
═══════════════════════════════════════════════════════ */
function openModal(item) {
  currentModal = item;
  document.getElementById('modal-img').className = `modal-img ${item.grad}`;
  document.getElementById('modal-img').textContent = item.icon;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-sub').textContent = `${item.tags.join(' · ')}`;
  document.getElementById('modal-score').textContent = item.score;
  document.getElementById('modal-prompt').textContent = item.prompt;
  document.getElementById('modal-tags').innerHTML = item.tags.map(t => `<span class="modal-tag">#${t}</span>`).join('');
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target.id === 'modal-bg') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
document.getElementById('modal-copy').addEventListener('click', () => {
  if (!currentModal) return;
  navigator.clipboard?.writeText(currentModal.prompt).catch(()=>{});
  const btn = document.getElementById('modal-copy');
  btn.innerHTML = `${svgIcon('i-sparkles')}<span>已复制</span>`;
  setTimeout(() => btn.innerHTML = `${svgIcon('i-copy')}<span>复制提示词</span>`, 1600);
});
document.getElementById('modal-use').addEventListener('click', () => {
  if (!currentModal) return;
  useTemplate(currentModal);
  closeModal();
});

/* ═══════════════════════════════════════════════════════
   对话流
═══════════════════════════════════════════════════════ */
const feed = document.getElementById('chat-feed');

function showEmpty() {
  feed.innerHTML = `
    <div class="empty">
      <div class="empty-icon">${svgIcon('i-sparkles','ic ic-lg')}</div>
      <div>
        <div class="empty-title">创作画面，从描述开始</div>
        <div class="empty-sub">试着输入一段场景描述，或者从左右侧栏选取一个参考模板</div>
      </div>
      <div class="empty-chips">
        <button class="empty-chip" data-q="一只坐在月球上的柴犬，水彩风格">🐕 月球上的柴犬</button>
        <button class="empty-chip" data-q="未来城市空中花园，玻璃穹顶，柔和暮光">🏙 空中花园</button>
        <button class="empty-chip" data-q="东方仙侠，云雾缭绕，青年剑客">⚔ 东方仙侠</button>
      </div>
    </div>`;
  feed.querySelectorAll('.empty-chip').forEach(c =>
    c.addEventListener('click', () => { setInput(c.dataset.q); }));
}

function setInput(v) {
  const ta = document.getElementById('composer-input');
  ta.value = v;
  autoResize(ta);
  ta.focus();
}

function pushUserMsg(text) {
  const m = document.createElement('div');
  m.className = 'msg-user';
  m.textContent = text;
  feed.appendChild(m);
}

function pushThinking() {
  const t = document.createElement('div');
  t.className = 'gen-block';
  t.innerHTML = `
    <div class="gen-avatar">${svgIcon('i-sparkles')}</div>
    <div class="gen-content">
      <div class="thinking">
        <div class="thinking-dots"><span></span><span></span><span></span></div>
        <span>正在生成画面...</span>
      </div>
    </div>`;
  feed.appendChild(t);
  return t;
}

function pushGeneration(prompt, { count=4, model='Nano Banana 2', ratio='16:9', quality='2K' } = {}) {
  const grads = ['grad-a','grad-b','grad-c','grad-d','grad-e','grad-f','grad-g','grad-h'];
  const icons = ['🎨','🖼','🌅','🌆','🌌','🏙','🌊','🏔','🌸','⚡'];
  // 随机选一组不重复的渐变
  const pickedGrads = [...grads].sort(() => Math.random() - .5).slice(0, count);
  const pickedIcon = icons[Math.floor(Math.random() * icons.length)];

  let grid = '';
  for (let i = 0; i < count; i++) {
    grid += `
      <div class="img-cell">
        <div class="img-num">#${i+1}</div>
        <div class="img-ph ${pickedGrads[i]}">${pickedIcon}</div>
        <div class="img-hover">
          <button class="img-chip">${svgIcon('i-download','ic ic-sm')}下载</button>
          <button class="img-chip">${svgIcon('i-refresh','ic ic-sm')}重生</button>
          <button class="img-chip">${svgIcon('i-star','ic ic-sm')}收藏</button>
        </div>
      </div>`;
  }

  const gridCls = count === 1 ? 'single' : count === 3 ? 'triple' : '';

  const block = document.createElement('div');
  block.className = 'gen-block';
  block.innerHTML = `
    <div class="gen-avatar">${svgIcon('i-sparkles')}</div>
    <div class="gen-content">
      <div class="img-grid ${gridCls}">${grid}</div>
      <div class="gen-meta">
        <span class="meta-chip accent"><span class="meta-dot"></span>${model}</span>
        <span class="meta-chip">${ratio}</span>
        <span class="meta-chip">${quality}</span>
        <span class="meta-chip">×${count}</span>
        <span class="meta-chip">3.4s</span>
      </div>
      <div class="gen-actions">
        <button class="action-btn primary">${svgIcon('i-sparkles')}生成同款</button>
        <button class="action-btn">${svgIcon('i-download')}下载全部</button>
        <button class="action-btn">${svgIcon('i-refresh')}再生成</button>
        <button class="action-btn">${svgIcon('i-more')}</button>
      </div>
    </div>`;
  feed.appendChild(block);
  feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
}

function sendMessage() {
  const ta = document.getElementById('composer-input');
  const text = ta.value.trim();
  if (!text) return;

  if (feed.querySelector('.empty')) feed.innerHTML = '';

  pushUserMsg(text);
  ta.value = '';
  autoResize(ta);
  activeRefs = [];
  renderRefs();

  const thinking = pushThinking();
  feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });

  setTimeout(() => {
    thinking.remove();
    pushGeneration(text, { count: Math.random() > .4 ? 4 : 2 });
  }, 1400);
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('composer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('composer-input').addEventListener('input', e => autoResize(e.target));
document.getElementById('add-ref-btn').addEventListener('click', () => {
  const pick = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
  useTemplate(pick);
});

/* ═══════════════════════════════════════════════════════
   示例对话
═══════════════════════════════════════════════════════ */
function loadExample() {
  feed.innerHTML = '';
  pushUserMsg('保持画面结构，画面整体变成新系统，保持金币不变，线路整齐有序，焕然一新，高级未来科幻感，所有人都站在地上欢呼');
  pushGeneration('', { count: 4, model: 'Nano Banana 2', ratio: '16:9', quality: '2K' });
}

/* ═══════════════════════════════════════════════════════
   初始化
═══════════════════════════════════════════════════════ */
renderSidebar('left-scroll', TEMPLATES);
renderSidebar('right-scroll', HISTORY);
document.getElementById('left-count').textContent = TEMPLATES.length;
document.getElementById('right-count').textContent = HISTORY.length;
loadExample();
</script>
</body>
</html>
