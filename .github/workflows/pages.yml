name: Deploy Joey Prompthub website

on:
  push:
    branches: [main]
    paths:
      - 'docs/官网主页/**'
      - 'package.json'
      - 'scripts/sync-website-release.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync fallback version
        run: npm run sync:website-release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/官网主页
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
